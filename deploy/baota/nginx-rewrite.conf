# 宝塔 Nginx 反向代理配置（Node 版）
#
# 用法：网站 → 设置 → 伪静态 → 粘贴本文件全部内容 → 保存。
# 前置：Node 服务已在 127.0.0.1:3001 运行（见部署说明）。
# 网站根目录指向包内的 public/（前端构建产物）。

# 敏感文件与数据库一律拒绝
location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
    deny all;
    return 404;
}

# HTML、robots.txt、sitemap.xml 需要及时更新，不做长缓存
location ~* \.(?:html?|txt|xml)$ {
    try_files $uri =404;
    expires -1;
    access_log off;
}

# 带 hash 的静态资源长缓存
location ~* \.(?:js|css|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|map|json|webmanifest)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
}

# 其余请求（POST /url、/api/*、GET /admin、GET /{code}、/healthz）全部转发给 Node
location / {
    try_files $uri $uri/ @backend;
}

location @backend {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 保留客户端 Host：后端 CSRF 同源判定依赖它
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 手动巡检单次最多 20s 预算，留足余量
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

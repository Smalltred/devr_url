[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:memcached]
command=memcached -m 64 -c 1024 -l 127.0.0.1 -p 11211 -u nobody
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 外链巡检已内置在 Node 进程内（见 HEALTH_SCAN_INTERVAL_SECONDS），
; 不再需要单独的定时任务进程。
[program:node]
command=node /app/backend/src/server.js
directory=/app/backend
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

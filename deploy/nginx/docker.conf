# 单容器（nginx + php-fpm 同容器）配置：Dockerfile 默认 target 使用
server {
    listen 80 default_server;
    server_name _;

    # Vue 构建产物（Vite 输出 dist/）
    root /app/dist;
    index index.html;

    # 敏感文件与后端源码一律拒绝（纵深防御：镜像内 /app/backend 与前端 dist 同镜像，
    # 即使 root 被误配到 /app 也不会泄露 .env、SQLite 库与 PHP 源码）
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    location ~ ^/(backend|app|storage|vendor|config|routes)/ {
        deny all;
        return 404;
    }
    # 禁止把 PHP 源码当静态文件下载
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        # 保留客户端 Host：后端 CSRF 同源判定依赖它
        fastcgi_param HTTP_HOST $http_host;
    }

    # 静态资源直接返回（Vite 资源带 hash，可长缓存）
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|map|json|txt|html)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 PHP：
    #   POST /url、POST /api/url、GET /{code}
    # 静态资源命中上面的 location，不会被误当成短码
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_HOST $http_host;
    }
}

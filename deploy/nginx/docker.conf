# 单容器（nginx + node 同容器）配置：Dockerfile 默认 target 使用
server {
    listen 80 default_server;
    server_name _;

    # Vue 构建产物（Vite 输出 dist/）
    root /app/dist;
    index index.html;

    # 敏感文件与后端源码一律拒绝（纵深防御：镜像内 /app/backend 与前端 dist 同镜像，
    # 即使 root 被误配到 /app 也不会泄露 .env 与 SQLite 库）
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    location ~ ^/(backend|storage|src|node_modules)/ {
        deny all;
        return 404;
    }

    # 静态资源直接返回（Vite 资源带 hash，可长缓存）
    location ~* \.(?:js|css|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|map|json|txt|html|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 Node：
    #   POST /url、POST /api/url、GET /admin、GET /{code}
    # 静态资源命中上面的 location，不会被误当成短码
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 保留客户端 Host：后端 CSRF 同源判定依赖它
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 单容器（nginx + php-fpm 同容器）配置：Dockerfile 默认 target 使用
server {
    listen 80 default_server;
    server_name _;

    # React 构建产物
    root /app/build;
    index index.html;

    # 静态资源直接返回（React 资源带 hash，可长缓存）
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|map|json|txt|html)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 PHP：
    #   POST /url、POST /api/url、GET /{code}
    # 静态资源命中上面的 location，不会被误当成短码
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
    }
}

# docker-compose 双容器模式的 nginx 配置（web 服务使用）
server {
    listen 80 default_server;
    server_name _;

    # Vue 构建产物（Vite 输出 dist/，web 镜像内路径）
    root /var/www/dist;
    index index.html;

    # 敏感文件与后端源码一律拒绝（纵深防御：web 镜像只含 dist，但防误配 root）
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    location ~ ^/(backend|storage|src|node_modules)/ {
        deny all;
        return 404;
    }

    # HTML、robots.txt、sitemap.xml 需要及时更新，不做长缓存
    location ~* \.(?:html?|txt|xml)$ {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|map|json|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 Node：POST /url、/api/*、GET /admin、GET /{code}
    # 静态资源命中上面的 location，不会被误当成短码
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 保留客户端 Host：后端 CSRF 同源判定依赖它
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 手动巡检单次最多 20s 预算，留足余量
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# docker-compose 双容器模式的 nginx 配置（web 服务使用）
server {
    listen 80 default_server;
    server_name _;

    # Vue 构建产物（Vite 输出 dist/，web 镜像内路径）
    root /var/www/dist;
    index index.html;

    # 敏感文件与后端源码一律拒绝（纵深防御：web 镜像只含 dist，但防误配 root）
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    location ~ ^/(backend|app|storage|vendor|config|routes)/ {
        deny all;
        return 404;
    }
    # 禁止把 PHP 源码当静态文件下载（PHP-FPM 不可达时 Nginx 会原样输出 .php）
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        # 保留客户端 Host：后端 CSRF 同源判定依赖它
        fastcgi_param HTTP_HOST $http_host;
    }

    # 静态资源直接返回
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|map|json|txt|html)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 PHP：POST /url、POST /api/url、GET /{code}
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        # app 为 compose 中的 php-fpm 服务名
        fastcgi_pass app:9000;
        include fastcgi_params;
        # SCRIPT_FILENAME 必须是 php-fpm 容器内的路径
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_HOST $http_host;
    }
}

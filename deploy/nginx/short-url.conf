# 宝塔 / 裸机 Nginx + PHP-FPM 部署配置示例
# 项目目录：/www/wwwroot/short-url
# 与宝塔自动生成的 server 段合并使用：把 root/index 与下面几个 location 抄进站点配置，
# 或在宝塔「配置文件」中整体替换（注意改 server_name 与 fastcgi_pass）。
server {
    listen 80;
    server_name your-domain.com;

    # Vue 构建产物目录（先在项目根执行 npm run build，生成 dist，不要删除）
    root /www/wwwroot/short-url/dist;
    index index.html;

    # 敏感文件与源码目录一律拒绝（纵深防御：即使 root 被误配到项目根也不会泄露）
    # 覆盖 .env、.git、SQLite 库、日志与备份
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    # 后端源码与数据目录不可经 Web 访问
    location ~ ^/(backend|app|config|routes|vendor|storage|tests|deploy|docs)/ {
        deny all;
        return 404;
    }
    # 禁止把 PHP 源码当静态文件下载（PHP-FPM 未运行时 Nginx 会原样输出 .php）
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/short-url/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        # 保留客户端 Host：后端 CSRF 同源判定与绝对链接生成依赖它
        fastcgi_param HTTP_HOST $http_host;
    }

    # 静态资源直接返回，避免短码被当成静态文件处理
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|map|json|txt|html)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 PHP：POST /url、POST /api/url、GET /{code}
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        # 宝塔 PHP 8.2 默认 unix socket（宝塔软件商店安装 PHP 8.2 后自动生成）：
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        # 若你的宝塔使用 TCP 方式，则改为：
        # fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/short-url/backend/public/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_HOST $http_host;
    }
}

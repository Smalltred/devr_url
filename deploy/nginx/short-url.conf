# 宝塔 / 裸机 Nginx 反向代理配置示例（Node.js 后端）
# 项目目录：/www/wwwroot/short-url
# 与宝塔自动生成的 server 段合并使用：把 root/index 与下面几个 location 抄进站点配置。
server {
    listen 80;
    server_name your-domain.com;

    # Vue 构建产物目录（先在项目根执行 npm run build，生成 dist，不要删除）
    root /www/wwwroot/short-url/dist;
    index index.html;

    # 敏感文件与源码目录一律拒绝（纵深防御：即使 root 被误配到项目根也不会泄露）
    location ~ (^|/)\.(env|git|svn|hg)|\.(sqlite3?|db|log|bak|swp|old|ini|sh)$ {
        deny all;
        return 404;
    }
    # 后端源码与数据目录不可经 Web 访问
    location ~ ^/(backend|storage|src|node_modules|tests|deploy|docs)/ {
        deny all;
        return 404;
    }

    # 静态资源直接返回，避免短码被当成静态文件处理
    location ~* \.(?:js|css|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|map|json|txt|html|webmanifest)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 其余路径全部交给 Node：POST /url、/api/*、GET /admin、GET /{code}、/healthz
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        # Node 服务监听 3001（可用 PM2 / 宝塔 Node 项目管理器托管）
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 保留客户端 Host：后端 CSRF 同源判定依赖它
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 手动巡检单次最多 20s 预算，留足余量
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

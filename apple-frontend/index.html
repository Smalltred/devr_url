    <!-- 结构化数据：搜索引擎可据此生成站点与应用信息 -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@graph": [
                {
                    "@type": "WebSite",
                    "@id": "%SITE_URL%/#website",
                    "url": "%SITE_URL%/",
                    "name": "Devr 短链接",
                    "description": "免费、简单易用的在线短链接生成工具，链接永久有效。",
                    "inLanguage": "zh-CN",
                    "publisher": { "@id": "%SITE_URL%/#organization" }
                },
                {
                    "@type": "Organization",
                    "@id": "%SITE_URL%/#organization",
                    "name": "Devr",
                    "url": "%SITE_URL%/",

                {
                    "@type": "WebApplication",

    <script>
        // 首帧渲染前应用主题，避免深色模式白屏闪烁。
        // 与旧前端共用 devr-theme 键：在 3000/3100 之间切换时主题保持一致。
        (function () {
            try {
                var t = localStorage.getItem('devr-theme');
                if (t !== 'dark' && t !== 'light') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = t;
            } catch (e) { /* localStorage 不可用时保持浅色 */ }
        })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03H85HPZC9"></script>

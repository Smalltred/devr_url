# docker-compose：nginx(web) + php-fpm(app) + memcached 三容器部署，短链数据经 SQLite 永久化
# 用法：
#   docker compose up -d --build
#   访问 http://localhost:3001
# 数据库文件在命名卷 app-data 中（容器内 /app/backend/storage），重建容器不丢数据。
# 短链跳转结果缓存在 memcached 中（命中即免查库）；memcached 不可用时自动降级为直连数据库。
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "3001:80"
    depends_on:
      - app

  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # 管理后台凭据：**生产环境必须修改**。
      # 推荐做法：在项目根 .env 中设置 ADMIN_PASSWORD（或 ADMIN_PASSWORD_HASH）后启动，
      # compose 会自动读取并注入；未设置时回退到内置默认值（admin123，仅便于本地试用）。
      # 密码哈希生成：php -r "echo password_hash('你的密码', PASSWORD_DEFAULT);"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # IP 匿名哈希密钥（推荐设置）：设置后改用 HMAC，库泄露也无法反推 IP
      IP_HASH_SECRET: ${IP_HASH_SECRET:-}
      # 跨域部署前端时才需要填写（逗号分隔的允许来源）
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 确认全站 HTTPS 后再设为 31536000 启用 HSTS
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      # 缓存（Memcached）：指向下方 memcached 服务；CACHE_DRIVER=none 可显式关闭
      MEMCACHED_SERVERS: memcached:11211
      CACHE_TTL: ${CACHE_TTL:-300}
      CACHE_NEGATIVE_TTL: ${CACHE_NEGATIVE_TTL:-30}
      # DATABASE_PATH 留空使用默认值 /app/backend/storage/short-url.sqlite3
      # DATABASE_PATH:
    volumes:
      - app-data:/app/backend/storage
    depends_on:
      - memcached

  memcached:
    image: memcached:1.6-alpine
    # 仅 app 容器需要访问，不对外暴露端口；内存上限按站点规模调整
    command: ["memcached", "-m", "64", "-c", "1024", "-I", "1m"]
    restart: unless-stopped

volumes:
  app-data:
